<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘보드">
<meta name="theme-color" content="#FAF4E9">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>오늘보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR",
                 "Noto Sans CJK KR", "Malgun Gothic", "맑은 고딕", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  html { background: #FAF4E9; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 12% -8%, #FFF3DC 0%, rgba(255,243,220,0) 62%),
      radial-gradient(760px 460px at 96% 4%, #FBE7E1 0%, rgba(251,231,225,0) 58%),
      #FAF4E9;
    background-attachment: fixed;
    color: #4A3B2A;
    padding: 44px 40px 52px;
    padding-top: max(44px, calc(env(safe-area-inset-top) + 16px));
    padding-left: max(40px, env(safe-area-inset-left));
    padding-right: max(40px, env(safe-area-inset-right));
  }
  /* 아이폰 홈 화면(PWA) 실행 시 상태바 시계와 본문이 겹치지 않도록 상단 여백 확보 */
  body::before {
    content: "";
    position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top, 0px);
    background: linear-gradient(180deg, #FFF3DC 0%, #FAF4E9 100%);
    pointer-events: none;
    z-index: 30;
  }
  .page { width: 100%; max-width: 1180px; margin: 0 auto; }
  .page[hidden] { display: none; }

  /* ── 상단 브리핑 배너 ───────────────────────────── */
  .banner {
    position: relative;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    align-items: center;
    background: linear-gradient(118deg, #FFFCF4 0%, #FFF4DE 46%, #FDE6C4 100%);
    border: 1px solid #F2DFBE;
    border-radius: 30px;
    padding: 34px 40px 32px;
    box-shadow: 0 22px 46px -22px rgba(158, 116, 62, .38), 0 2px 0 #fff inset;
    overflow: hidden;
  }
  .banner::after {
    content: "";
    position: absolute; right: -70px; top: -90px;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle at 34% 32%, rgba(255,255,255,.85), rgba(253,226,182,.28) 58%, rgba(253,226,182,0) 72%);
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .16em;
    color: #A9782F; text-transform: uppercase;
  }
  .eyebrow .sun {
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #FFE9A8, #F3B94A 72%);
    box-shadow: 0 0 0 4px rgba(243,185,74,.18);
  }
  .banner-top { position: relative; z-index: 1; min-width: 0; }
  .banner h1 {
    margin: 12px 0 8px;
    font-size: 37px; line-height: 1.24; letter-spacing: -.9px; color: #3F3021;
  }
  .banner h1 b { color: #A9721F; }
  .banner .lede { font-size: 15.5px; color: #7C6647; letter-spacing: -.15px; }
  .chips { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.78);
    border: 1px solid #F1DFC0;
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px; font-weight: 600; color: #6D5738;
    box-shadow: 0 1px 2px rgba(140,105,60,.06);
  }
  .chip b { color: #8E5F1C; font-weight: 800; }
  .chip .cd { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .chip.warn { background: #FFF3E0; border-color: #F6CF9A; color: #A25F12; }

  /* 날씨 */
  .weather {
    position: relative; z-index: 2;
    background: rgba(255,255,255,.82);
    border: 1px solid #F3E1C2;
    border-radius: 24px;
    padding: 18px 20px;
    text-align: center;
    box-shadow: 0 12px 24px -14px rgba(158,116,62,.4);
  }
  .weather .place { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #A9782F; }
  .weather .temp { font-size: 30px; font-weight: 800; letter-spacing: -1px; color: #4A3620; margin: 6px 0 2px; }
  .weather .temp span { font-size: 15px; font-weight: 700; color: #A08A6C; }
  .weather .cond { font-size: 13px; color: #7C6647; font-weight: 600; }
  .weather .next {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed #EED9B8;
    font-size: 12px; color: #9A7B4F; line-height: 1.5;
  }

  /* ── 2단 그리드 ───────────────────────────── */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 26px; }
  .col-head { display: flex; align-items: center; gap: 10px; margin: 0 4px 12px; }
  .col-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .col-head .dot.store { background: #C98B3C; box-shadow: 0 0 0 4px rgba(201,139,60,.16); }
  .col-head .dot.life  { background: #7E9C72; box-shadow: 0 0 0 4px rgba(126,156,114,.16); }
  .col-head h2 { font-size: 15.5px; letter-spacing: -.2px; color: #3F3021; }
  .col-head .sub { font-size: 12px; color: #A08A6C; margin-left: auto; font-weight: 600; text-align: right; }

  .card {
    background: #FFFDF8;
    border: 1px solid #EFE2CC;
    border-radius: 24px;
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow: 0 10px 24px -18px rgba(120, 88, 46, .5);
  }
  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .card-head h3 { font-size: 15px; letter-spacing: -.3px; color: #453322; }
  .card-head .tag {
    margin-left: auto; font-size: 11.5px; font-weight: 800; letter-spacing: .02em;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
    background: #FBF0DA; color: #A9782F; border: 1px solid #F2E0BD;
  }
  .card-head .tag.done { background: #EFF4EA; color: #5F7E52; border-color: #DEE9D5; }
  .card-head .tag.hot  { background: #FDECE3; color: #B45B2E; border-color: #F7D8C7; }

  /* ── 개인 보드 섹션 그리드 (복약 · 할 일 · 카드값 · 모은 돈 · 쿠폰 · 날씨) ── */
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 26px; }
  .sections > .card { margin-bottom: 0; display: flex; flex-direction: column; }
  .sections.tight { margin-top: 0; }
  .extra { margin-top: 30px; }

  /* 날씨 */
  .wnow { display: flex; align-items: baseline; gap: 9px; margin-top: 2px; }
  .wtemp { font-size: 40px; font-weight: 800; letter-spacing: -1.6px; color: #4A3620; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .wrange { font-size: 17px; font-weight: 700; color: #A08A6C; font-variant-numeric: tabular-nums; }
  .wcond { font-size: 13.5px; font-weight: 600; color: #7C6647; margin-top: 6px; }
  .wnext {
    margin-top: auto; padding-top: 14px; border-top: 1px dashed #EED9B8;
    font-size: 12px; color: #9A7B4F; line-height: 1.5;
  }

  /* 할 일 행 */
  .task {
    display: grid; grid-template-columns: 34px 1fr auto;
    align-items: center; gap: 12px;
    padding: 10px 0;
  }
  .task + .task { border-top: 1px solid #F6EEDF; }
  .task > div { min-width: 0; }
  .ico {
    width: 34px; height: 34px; border-radius: 12px;
    display: grid; place-items: center;
    background: #FBF2E1; border: 1px solid #F2E4CB;
  }
  .ico svg { width: 18px; height: 18px; }
  .task .t { font-size: 14px; font-weight: 700; color: #443322; letter-spacing: -.2px; }
  .task .d { font-size: 11.5px; color: #A4937A; margin-top: 3px; line-height: 1.45; }
  .state { font-size: 11.5px; font-weight: 800; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .state.todo { background: #FDECE3; color: #B45B2E; }
  .state.ok { background: #EFF4EA; color: #5F7E52; }
  .state.wait { background: #F3F0FA; color: #6E5FA8; }

  /* 진행 점 */
  .dots { display: flex; gap: 5px; margin-top: 6px; }
  .dots i { width: 20px; height: 6px; border-radius: 3px; background: #EFE4D1; }
  .dots i.on { background: linear-gradient(90deg, #E7B75F, #C98B3C); }

  /* 포인트 */
  .moneytop { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .moneytop .big { font-size: 34px; font-weight: 800; letter-spacing: -1.2px; color: #4A3620; font-variant-numeric: tabular-nums; }
  .moneytop .unit { font-size: 15px; font-weight: 700; color: #A08A6C; padding-bottom: 5px; }
  .moneytop .note { margin-left: auto; font-size: 11.5px; color: #A4937A; padding-bottom: 6px; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pitem {
    display: flex; align-items: center; gap: 9px;
    background: #FDF8EF; border: 1px solid #F1E5D2; border-radius: 14px;
    padding: 10px 12px;
  }
  .pitem .n { font-size: 11.5px; color: #8E7C64; font-weight: 700; }
  .pitem .v { font-size: 13.5px; font-weight: 800; color: #4A3620; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pdot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .pitem > div { min-width: 0; }

  /* 결제 예정 카드값 */
  .billtop { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .billtop .big { font-size: 34px; font-weight: 800; letter-spacing: -1.2px; color: #4A3620; font-variant-numeric: tabular-nums; }
  .billtop .unit { font-size: 15px; font-weight: 700; color: #A08A6C; padding-bottom: 5px; }
  .billtop .due { margin-left: auto; padding-bottom: 4px; display: flex; align-items: center; gap: 7px; }
  .duechip {
    font-size: 12px; font-weight: 800; letter-spacing: -.1px; color: #FFFDF8;
    background: linear-gradient(100deg, #D9A05A, #B9792C);
    border-radius: 9px; padding: 5px 9px; white-space: nowrap;
  }
  .billtop .dtx { font-size: 11.5px; font-weight: 700; color: #9A7539; line-height: 1.4; }
  .splitbar { display: flex; gap: 3px; height: 9px; margin-bottom: 10px; }
  .splitbar i { display: block; height: 100%; border-radius: 5px; min-width: 5px; }
  .bill {
    display: grid; grid-template-columns: 10px 1fr auto auto;
    align-items: center; gap: 11px; padding: 11px 0; cursor: pointer;
  }
  .bill + .bill { border-top: 1px dashed #EFE4D2; }
  .bill .bdot { width: 10px; height: 10px; border-radius: 4px; flex: none; }
  .bill .bname { font-size: 14px; font-weight: 700; color: #443322; letter-spacing: -.2px; }
  .bill .bmeta { font-size: 11.5px; color: #A4937A; margin-top: 3px; line-height: 1.45; }
  .bill .bamt { font-size: 15px; font-weight: 800; color: #4A3620; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bill .bamt small { font-size: 11.5px; font-weight: 700; color: #A08A6C; margin-left: 2px; }
  .bill.paid .bname { color: #5F7E52; }
  .bill.paid .bmeta { color: #7B9470; }
  .bill.paid .bamt { color: #97A98C; text-decoration: line-through; text-decoration-color: #CBD8C2; }
  .bill-foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid #F6EEDF; font-size: 11px; color: #B3A48E; line-height: 1.55; letter-spacing: -.1px; }

  /* 사진 업로드 일정 */
  .sections > .card.wide { grid-column: 1 / -1; }
  .hicon.emoji { font-size: 15px; line-height: 1; }
  .shots { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .shots-col { background: #FDF8EF; border: 1px solid #F1E5D2; border-radius: 18px; padding: 12px 16px 6px; }
  .shots-col.alt { align-self: start; }
  .shots-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 0 9px; border-bottom: 1px solid #F1E5D2; }
  .shots-head .st { font-size: 13.5px; font-weight: 800; color: #443322; letter-spacing: -.2px; }
  .shots-head .when { font-size: 10.5px; font-weight: 800; color: #A9782F; background: #FBF0DA; border: 1px solid #F2E0BD; border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
  .prow { display: grid; grid-template-columns: 48px 60px 1fr; align-items: center; gap: 10px; padding: 8px 0; }
  .prow + .prow { border-top: 1px dashed #EFE4D2; }
  .pdate { font-size: 11.5px; font-weight: 800; color: #9A7539; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pname { font-size: 13px; font-weight: 700; color: #443322; letter-spacing: -.2px; }
  .prow.today .pdate { color: #B45B2E; }
  .prow.today .pname { color: #A8622A; }
  .pok {
    display: inline-block; margin-left: 6px; vertical-align: 1px;
    font-size: 10px; font-weight: 800; color: #5F7E52;
    background: #EFF4EA; border: 1px solid #DEE9D5; border-radius: 999px; padding: 2px 6px;
  }
  .pthumb {
    width: 48px; height: 48px; padding: 0; border: 1px solid #EFE2CC; border-radius: 12px;
    overflow: hidden; background: #F6EEDF; cursor: pointer; display: block; flex: none;
    -webkit-tap-highlight-color: transparent; transition: transform .12s ease, box-shadow .12s ease;
  }
  .pthumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pthumb:active { transform: scale(.95); }
  .pthumb:focus-visible { outline: 2px solid #B47A3C; outline-offset: 2px; }
  .pthumb.empty { border-style: dashed; background: #FBF5E8; }
  .photoview { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 26px 20px; }
  .photoview[hidden] { display: none; }
  .pv-back { position: absolute; inset: 0; background: rgba(42,30,18,.6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .pv-box {
    position: relative; margin: 0; z-index: 1; max-width: min(400px, 92vw);
    background: #FFFDF9; border-radius: 20px; padding: 10px 10px 0;
    box-shadow: 0 20px 54px rgba(60,40,20,.36);
  }
  .pv-box img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; border-radius: 14px; background: #F6EEDF; }
  .pv-box figcaption { font-size: 12.5px; font-weight: 700; color: #7A6446; letter-spacing: -.2px; padding: 10px 4px 14px; text-align: center; }
  .pv-close {
    position: absolute; top: -13px; right: -13px; width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: 50%; background: #443322; color: #FFF8EC;
    font-size: 19px; line-height: 1; font-weight: 700; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(40,25,10,.3); cursor: pointer;
  }
  .pv-close:active { transform: scale(.94); }

  /* 쿠폰 */
  .coupon {
    display: grid; grid-template-columns: 74px 1fr auto;
    align-items: center; gap: 13px;
    padding: 11px 0;
  }
  .coupon + .coupon { border-top: 1px dashed #EFE4D2; }
  .coupon > div:nth-child(2) { min-width: 0; }
  .cval {
    text-align: center; font-weight: 800; font-size: 14px; color: #8E4E63;
    background: #FBEEF2; border: 1px dashed #EFD3DC; border-radius: 12px; padding: 9px 0;
    font-variant-numeric: tabular-nums;
  }
  .cval small { display: block; font-size: 10px; color: #B790A0; font-weight: 700; margin-top: 1px; }
  .cname { font-size: 13.5px; font-weight: 700; color: #443322; }
  .cmeta { font-size: 11.5px; color: #A4937A; margin-top: 3px; }
  .dday {
    font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px;
    background: #F4F0E9; color: #8B7B63; white-space: nowrap;
  }
  .dday.today { background: #FDECE3; color: #B45B2E; }

  /* 체험단 */
  .ehhead { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .ehhead .num { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: #4A3620; font-variant-numeric: tabular-nums; }
  .ehhead .lbl { font-size: 13px; color: #8E7C64; font-weight: 700; padding-bottom: 6px; }
  .ehhead .zero { margin-left: auto; font-size: 11.5px; font-weight: 800; color: #8B7B63; background: #F4F0E9; padding: 5px 10px; border-radius: 999px; }
  .erow {
    display: grid; grid-template-columns: minmax(52px, auto) 1fr auto;
    gap: 12px; align-items: center;
    padding: 9px 0;
  }
  .erow + .erow { border-top: 1px solid #F6EEDF; }
  .edate { font-size: 12px; font-weight: 800; color: #9A7539; font-variant-numeric: tabular-nums; }
  .ename { font-size: 13.5px; font-weight: 700; color: #443322; letter-spacing: -.2px; }
  .ecnt { font-size: 11.5px; color: #A4937A; font-weight: 700; white-space: nowrap; }

  /* ── 직접 체크하는 것 (복약 / 할 일·구매 목록) ───────── */
  .card-head.mid { align-items: center; }
  .hicon {
    width: 31px; height: 31px; border-radius: 11px; flex: none;
    display: grid; place-items: center;
    background: #FBF2E1; border: 1px solid #F2E4CB;
  }
  .hicon svg { width: 17px; height: 17px; }

  /* 복약 */
  .med {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px;
    padding: 13px 16px; border-radius: 18px;
    background: #FDF8EF; border: 1px solid #F1E5D2;
    transition: background .18s, border-color .18s;
  }
  .med + .med { margin-top: 10px; }
  .sections .med { flex: 1 1 auto; min-height: 76px; max-height: 118px; }
  .med.done { background: linear-gradient(100deg, #F2F7EE, #EAF2E3); border-color: #DDE9D5; }
  .mline { display: flex; align-items: center; gap: 7px; }
  .med input.nm {
    font: inherit; font-size: 14px; font-weight: 800; letter-spacing: -.2px; color: #443322;
    background: transparent; border: none; border-bottom: 1px dashed transparent;
    padding: 1px 2px; flex: 1; min-width: 0; width: 100%;
    -webkit-appearance: none; border-radius: 0;
  }
  .med input.nm:hover { border-bottom-color: #E4D3B7; }
  .med input.nm:focus { outline: none; border-bottom-color: #C98B3C; background: #FFFDF8; }
  .med.done input.nm { color: #4E6B43; }
  .pencil {
    width: 22px; height: 22px; flex: none; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; padding: 0;
    background: #F6EBD7; border: 1px solid #EEDFC4;
  }
  .pencil svg { width: 12px; height: 12px; }
  .pencil:hover { background: #F1E1C4; }
  .mmeta { font-size: 11.5px; color: #A4937A; font-weight: 600; margin-top: 5px; letter-spacing: -.1px; }
  .med.done .mmeta { color: #5F7E52; }
  .med-foot { margin-top: auto; padding-top: 14px; font-size: 11px; color: #B3A48E; letter-spacing: -.1px; line-height: 1.55; }

  /* 켜고 끄는 토글 스위치 */
  .sw {
    position: relative; width: 46px; height: 27px; flex: none; padding: 0; cursor: pointer;
    border-radius: 999px; background: #EDE1CC; border: 1px solid #E1D2B7;
    transition: background .18s, border-color .18s;
  }
  .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 21px; height: 21px; border-radius: 50%;
    background: #FFFDF8; box-shadow: 0 1px 3px rgba(120,88,46,.32);
    transition: transform .18s;
  }
  .sw.on { background: linear-gradient(100deg, #A6C098, #7E9C72); border-color: #71905F; }
  .sw.on::after { transform: translateX(19px); }
  .sw:focus-visible { outline: 2px solid #C98B3C; outline-offset: 2px; }
  .sw.sm { width: 38px; height: 22px; }
  .sw.sm::after { width: 16px; height: 16px; }
  .sw.sm.on::after { transform: translateX(16px); }

  /* 목록 */
  .composer { display: grid; grid-template-columns: 1fr 92px auto; gap: 8px; }
  .composer input {
    font: inherit; font-size: 13.5px; font-weight: 600; color: #443322; min-width: 0;

  .pday.sat .pn { color: #93A6BC; }

  .pmemos { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #F0E2CE; }

  .pfoot { margin-top: 12px; font-size: 10.5px; color: #B3A48E; line-height: 1.55; letter-spacing: -.1px; }

  #pBulk {

  /* 날짜 편집 시트 */
  .psheet { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
  .psheet[hidden] { display: none; }
  .ps-back { position: absolute; inset: 0; background: rgba(42,30,18,.5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .ps-box {
    position: relative; z-index: 1; width: 100%; max-width: 420px;

    padding: 18px 18px calc(16px + env(safe-area-inset-bottom));

  .ps-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }

  .ps-sub { font-size: 11.5px; font-weight: 700; color: #A4937A; margin-top: 3px; }

  /* ── 잠금 화면 ───────────────────────────── */
  .lock {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(700px 420px at 20% -6%, #FFF3DC 0%, rgba(255,243,220,0) 60%),
      radial-gradient(600px 380px at 92% 6%, #FBE7E1 0%, rgba(251,231,225,0) 58%),
      #FAF4E9;
    padding: 32px 22px;
    padding-bottom: max(28px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .lock[hidden] { display: none; }
  .lock-inner { width: 100%; max-width: 336px; text-align: center; }
  .lock-badge {
    width: 66px; height: 66px; margin: 0 auto 18px; border-radius: 23px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #FFF7E7, #F7DFB6);
    border: 1px solid #F0DCB6;
    box-shadow: 0 16px 30px -18px rgba(158,116,62,.55), 0 1px 0 #fff inset;
  }
  .lock-badge svg { width: 30px; height: 30px; }
  .lock-title { font-size: 23px; font-weight: 800; letter-spacing: -.7px; color: #3F3021; }
  .lock-sub { font-size: 13px; color: #8E7C64; margin-top: 7px; line-height: 1.5; }
  .pwform { margin-top: 24px; }
  .pwfield { position: relative; }
  .pwfield input {
    font: inherit; font-size: 17px; font-weight: 700; letter-spacing: .04em; color: #4A3B2A;
    width: 100%; height: 56px; text-align: center;
    background: #FFFDF8; border: 1px solid #EFE2CC; border-radius: 18px;
    padding: 0 46px;
    box-shadow: 0 8px 16px -14px rgba(120,88,46,.65), 0 1px 0 #fff inset;
    -webkit-appearance: none;
  }
  .pwfield input::placeholder { color: #C3B29A; font-weight: 600; letter-spacing: 0; }
  .pwfield input:focus { outline: none; border-color: #DDBE8F; box-shadow: 0 0 0 3px rgba(201,139,60,.16); }
  .pwfield input:disabled { opacity: .7; }
  .eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 12px; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: transparent; border: none; color: #B48A55;
  }
  .eye svg { width: 19px; height: 19px; }
  .eye:active { background: #FBF2E1; }
  .openbtn {
    font: inherit; font-size: 15.5px; font-weight: 800; letter-spacing: -.2px; color: #5A3B12;
    width: 100%; margin-top: 10px; padding: 15px 0; cursor: pointer;
    background: linear-gradient(100deg, #F4D39C, #E9B765);
    border: 1px solid #E3C087; border-radius: 18px;
    box-shadow: 0 10px 18px -12px rgba(180,130,60,.9);
  }
  .openbtn:active { transform: translateY(1px); }
  .openbtn[disabled] { opacity: .6; cursor: default; transform: none; }
  .perr { min-height: 22px; margin-top: 12px; font-size: 12.5px; font-weight: 700; color: #B4553A; }
  .lock-foot { margin-top: 18px; font-size: 11px; color: #B3A48E; line-height: 1.5; }
  .lock.shake .lock-inner { animation: shake .4s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(4px); }
  }
  .curl { font-size: 12px; color: #8E7C64; margin-top: 20px; }

  /* ── 좁은 화면(폰) ───────────────────────── */
  @media (max-width: 1024px) {
    body { padding: 26px 22px 40px; padding-top: max(26px, calc(env(safe-area-inset-top) + 14px)); padding-left: max(22px, env(safe-area-inset-left)); padding-right: max(22px, env(safe-area-inset-right)); }
    .banner { padding: 28px 26px 26px; border-radius: 26px; }
    .banner h1 { font-size: 31px; }
    .board { gap: 20px; }
    .sections { gap: 20px; }
  }
  @media (max-width: 860px) {
    .banner { grid-template-columns: 1fr; gap: 16px; }
    .board, .sections { grid-template-columns: 1fr; }
    .shots { grid-template-columns: 1fr; }
    .strip { grid-template-columns: 1fr 1fr; }

/* ── 매일 아침 패치 ───────────────────────────

var PATCH_URL = "./board-patch.json";
var PATCH_KEYS = ["date", "headline", "lede", "chips", "weather", "coupons", "couponTag",
  "apply", "weekTasks", "strip", "foot", "photoTag", "photoDone"];

function patchCopy(o) {

/* 금액·개인 항목(bills.items, money, bills.total)은 patch로 바꾸지 못한다. */
function mergePatch(data, p) {
  if (!data || !p || typeof p !== "object") return data;
  var out = patchCopy(data);
  PATCH_KEYS.forEach(function (k) {
    var v = p[k];
    if (v === undefined || v === null) return;
    if (k === "date" || k === "foot" || k === "couponTag" || k === "photoTag") {
      if (typeof v === "string" && v) out[k] = v;
    } else if (k === "headline" || k === "lede") {
      if (typeof v === "string") out[k] = v;
    } else if (Array.isArray(v) || typeof v === "object") {
      out[k] = v;
    }
  });
  if (p.bills && typeof p.bills === "object") {
    var b = patchCopy(out.bills || {});
    ["tag", "dueShort", "dueText"].forEach(function (k) {
      if (typeof p.bills[k] === "string" && p.bills[k]) b[k] = p.bills[k];
    });

  }

}
function loadPatch(data) {
  if (typeof fetch !== "function") return Promise.resolve(data);
  return fetch(PATCH_URL + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("patch " + res.status); return res.json(); })
    .then(function (p) { patchAt = Date.now(); return mergePatch(data, p); })
    .catch(function () { return data; });
}
/* 앱을 다시 열었을 때 10분 넘게 지났으면 패치를 새로 읽어 화면을 맞춘다. */
function refreshPatch() {
  if (!BASE || !DATA || $("page").hidden) return;
  var sh = $("pSheet");
  if (sh && !sh.hidden) return; /* 날짜를 적는 중이면 새로 그리지 않는다 */
  if (Date.now() - patchAt < 600000) return;
  var ae = document.activeElement; /* 적던 글이 있으면 건드리지 않는다 */
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.value) return;
  loadPatch(BASE).then(function (d) {
    if (!DATA || $("page").hidden) return;
    showPage(d);
  });
}

/* ── 날짜 도우미 ───────────────────────────── */
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function dayKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseDay(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function md(s) { return s ? s.slice(5, 7) + "/" + s.slice(8, 10) : ""; }
function weekKey(d) {
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return dayKey(t);
}

/* ── 저장 상태 ─────────────────────────────── */
function defaults() {
  var t = new Date();
  var wk = weekKey(t), mon = parseDay(wk);
  var cand = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 3);
  var lastWeekly = cand < mon ? mon : cand;
  return {
    meds: {
      daily: { name: "매일 먹는 약", doneDate: null },
      weekly: { name: "일주일에 한 번 먹는 약", last: dayKey(lastWeekly), prev: null, doneWeek: wk }
    },
    bills: {},
    items: [
      { id: "seed1", cat: "buy",  text: "장보기 (1만+8천 쿠폰)", done: true },
      { id: "seed2", cat: "todo", text: "쿠팡 식재료 리뷰 사진 찍기", done: false },
      { id: "seed3", cat: "todo", text: "네일 이용권 사용 (~11/24)", done: false },
      { id: "seed4", cat: "todo", text: "여행 숙박이용확인서 챙기기", done: false }
    ]
  };
}
function normalize(s) {
  if (!s || typeof s !== "object" || !s.meds || !Array.isArray(s.items)) return defaults();
  var d = { meds: {}, items: [], bills: {} };
  if (s.bills && typeof s.bills === "object") {
    Object.keys(s.bills).forEach(function (k) {
      var v = s.bills[k];
      if (!v || typeof v !== "object") return;
      var keep = {};
      Object.keys(v).forEach(function (id) { if (v[id]) keep[id] = true; });
      if (Object.keys(keep).length) d.bills[k] = keep;
    });
  }
  var dm = s.meds.daily || {}, wm = s.meds.weekly || {};
  d.meds.daily = {
    name: typeof dm.name === "string" && dm.name ? dm.name : "매일 먹는 약",
    doneDate: typeof dm.doneDate === "string" ? dm.doneDate : null
  };
  d.meds.weekly = {
    name: typeof wm.name === "string" && wm.name ? wm.name : "일주일에 한 번 먹는 약",
    last: typeof wm.last === "string" ? wm.last : null,
    prev: typeof wm.prev === "string" ? wm.prev : null,
    doneWeek: typeof wm.doneWeek === "string" ? wm.doneWeek : null
  };
  s.items.forEach(function (it) {
    if (!it || typeof it.text !== "string" || !it.text.trim()) return;
    d.items.push({
      id: it.id || "i" + Math.random().toString(36).slice(2, 8),
      cat: it.cat === "buy" ? "buy" : "todo",
      text: it.text.slice(0, 60),
      done: !!it.done

  });

}

var STORE_RX = /(똑톡|매장|매출|픽업)/;
function storeish(v) { return STORE_RX.test(String(v == null ? "" : v)); }
/* 구분자(기본 ·)로 나눠 매장 관련 조각만 덜어낸다. "<br>"로도 쓸 수 있다. */
function sane(v, sep) {
  var s = sep || "·";
  var parts = String(v == null ? "" : v).split(s);
  var keep = [];
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (p && !storeish(p)) keep.push(p);
  }
  var joiner = (s === "·") ? " · " : s;
  return keep.join(joiner).trim();
}

/* ══════════════════════════════════════════════
   생리 캘린더
   기록·설정은 오직 이 기기 localStorage(todayboard_period_v1)에만 둔다.
   공개 저장소(index.html)와 board-patch.json에는 어떤 날짜도 남기지 않는다.
   ══════════════════════════════════════════════ */
var PERIOD_KEY = "todayboard_period_v1";
var PERIOD_STICKERS = [
  { id: "red",    emoji: "🔴", label: "빨간점" },
  { id: "orange", emoji: "🟠", label: "주황점" },
  { id: "blue",   emoji: "🔵", label: "파란점" },
  { id: "heart",  emoji: "💗", label: "하트" },
  { id: "pill",   emoji: "💊", label: "약" },
  { id: "star",   emoji: "⭐", label: "별" },
  { id: "drop",   emoji: "💧", label: "물방울" },
  { id: "moon",   emoji: "🌙", label: "달" }
];
var PSTATE = null, PVIEW = null, PSEL = null;

function pAdd(k, n) { var d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); }
function pDiff(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
function pMd(k) { return k ? k.slice(5, 7) + "/" + k.slice(8, 10) : ""; }
function pWd(k) { return ["일", "월", "화", "수", "목", "금", "토"][parseDay(k).getDay()]; }
function pRec(k) { return (PSTATE && PSTATE.days && PSTATE.days[k]) || null; }
function pStickerOf(id) {
  for (var i = 0; i < PERIOD_STICKERS.length; i++) if (PERIOD_STICKERS[i].id === id) return PERIOD_STICKERS[i];
  return null;
}
function pStickerEmoji(list) {
  var out = "";
  (list || []).forEach(function (id) { var s = pStickerOf(id); if (s) out += s.emoji; });
  return out;
}
function pStickerNames(list) {
  var out = [];
  (list || []).forEach(function (id) { var s = pStickerOf(id); if (s) out.push(s.label); });
  return out.join(" · ");
}
function pTidy(k) {
  var r = PSTATE.days[k];
  if (!r) return;
  if (!r.p && !(r.st && r.st.length) && !r.memo) delete PSTATE.days[k];
}
function pCleanDays(raw) {
  var out = {};
  if (!raw || typeof raw !== "object") return out;
  Object.keys(raw).forEach(function (k) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    var v = raw[k];
    if (!v || typeof v !== "object") return;
    var rec = {};
    if (v.s) { rec.s = true; rec.p = true; }
    else if (v.p) rec.p = true;
    if (Array.isArray(v.st)) {
      var st = [];
      v.st.forEach(function (id) {
        if (typeof id === "string" && pStickerOf(id) && st.indexOf(id) < 0) st.push(id);
      });
      if (st.length) rec.st = st.slice(0, 8);
    }
    if (typeof v.memo === "string" && v.memo.trim()) rec.memo = v.memo.slice(0, 200);
    if (rec.p || rec.st || rec.memo) out[k] = rec;
  });
  return out;
}
function periodLoad() {
  var raw = null;
  try { raw = localStorage.getItem(PERIOD_KEY); } catch (e) {}
  var s = null;
  if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
  var out = { v: 1, cycle: 28, periodLen: 5, auto: true, days: {} };
  if (s && typeof s === "object") {
    if (typeof s.cycle === "number" && s.cycle >= 18 && s.cycle <= 90) out.cycle = Math.round(s.cycle);
    if (typeof s.periodLen === "number" && s.periodLen >= 1 && s.periodLen <= 15) out.periodLen = Math.round(s.periodLen);
    if (s.auto === false) out.auto = false;
    out.days = pCleanDays(s.days);
  }
  return out;
}
function periodSave() {
  try { localStorage.setItem(PERIOD_KEY, JSON.stringify(PSTATE)); return true; }
  catch (e) { return false; }
}

/* ── 주기 · 기간 통계 ───────────────────────── */
function pStarts() {
  var out = [];
  Object.keys(PSTATE.days).forEach(function (k) {
    if (PSTATE.days[k] && PSTATE.days[k].s) out.push(k);
  });
  out.sort();
  return out;
}
function pRunLen(k) {
  var n = 0;
  while (n < 40 && pRec(k) && pRec(k).p) { n++; k = pAdd(k, 1); }
  return n;
}
function pRunStart(k) {
  var i = 0;
  while (i < 60 && pRec(k) && pRec(k).p) { k = pAdd(k, -1); i++; }
  return pAdd(k, 1);
}
function pInfo() {
  var starts = pStarts(), diffs = [], i, s = 0;
  for (i = 1; i < starts.length; i++) {
    var dd = pDiff(starts[i - 1], starts[i]);
    if (dd >= 15 && dd <= 90) diffs.push(dd);
  }
  var mean = null;
  if (diffs.length) { for (i = 0; i < diffs.length; i++) s += diffs[i]; mean = s / diffs.length; }
  var autoOn = !!(PSTATE.auto && diffs.length);
  var cycle = autoOn ? Math.round(mean) : PSTATE.cycle;
  var lens = [];
  for (i = 0; i < starts.length; i++) { var n = pRunLen(starts[i]); if (n > 0) lens.push(n); }
  var len = PSTATE.periodLen;
  if (autoOn && lens.length) {
    var t = 0;
    for (i = 0; i < lens.length; i++) t += lens[i];
    len = Math.max(1, Math.round(t / lens.length));
  }
  var last = starts.length ? starts[starts.length - 1] : null;
  var next = last ? pAdd(last, cycle) : null;
  return {
    starts: starts, diffs: diffs, mean: mean, autoOn: autoOn, cycle: cycle,
    len: len, lens: lens, last: last, next: next, ovu: next ? pAdd(next, -14) : null
  };
}

/* ── 요약 ─────────────────────────────────── */
function pSumHTML(info) {
  if (!info.starts.length) {
    return '<div class="psum">' +
      '<div><div class="pbig small">시작일을 눌러 기록해 보세요</div>' +
        '<button type="button" class="pquick" id="pQuick">기간 한 번에 넣기</button></div>' +
      '<div class="pmeta">주기 기본 28일<br>기간 기본 5일</div></div>';
  }
  var tk = dayKey(new Date()), tr = pRec(tk), big, where;
  if (tr && tr.p) {
    var rs = pRunStart(tk);
    big = "생리 중";
    where = (pDiff(rs, tk) + 1) + "일째 · " + pMd(rs) + " 시작";
  } else {
    var dn = pDiff(tk, info.next);
    if (dn > 0) { big = "D-" + dn; where = "다음 생리까지"; }
    else if (dn === 0) { big = "D-DAY"; where = "오늘 예정일이에요"; }
    else { big = "D+" + (-dn); where = "예정일이 " + (-dn) + "일 지났어요"; }
  }
  var meta = "다음 예정 " + pMd(info.next) + " (" + pWd(info.next) + ")" +
    "<br>평균 주기 " + info.cycle + "일 · 평균 " + info.len + "일" + (info.autoOn ? " · 자동" : "");
  return '<div class="psum"><div class="pbig">' + big + '</div>' +
    '<div class="pwhere">' + where + '</div>' +
    '<div class="pmeta">' + meta + '</div></div>';
}

/* ── 달력 ─────────────────────────────────── */
function pGridHTML(info) {
  var y = PVIEW.y, m = PVIEW.m;
  var tk = dayKey(new Date());
  var pad = (new Date(y, m, 1).getDay() + 6) % 7;
  var total = new Date(y, m + 1, 0).getDate();
  var exStart = info.next, exEnd = info.next ? pAdd(info.next, info.len - 1) : null;
  var fertA = info.ovu ? pAdd(info.ovu, -5) : null;
  var fertB = info.ovu ? pAdd(info.ovu, 1) : null;
  var out = [], d;
  for (d = 0; d < pad; d++) out.push('<span class="pday blank" aria-hidden="true"></span>');
  for (d = 1; d <= total; d++) {
    var k = y + "-" + pad2(m + 1) + "-" + pad2(d);
    var rec = pRec(k);
    var cls = ["pday"], tags = [];
    var dow = new Date(y, m, d).getDay();
    if (dow === 0) cls.push("sun");
    if (dow === 6) cls.push("sat");
    var isP = !!(rec && rec.p);
    if (isP) { cls.push("pper"); tags.push("생리"); }
    else if (exStart && k >= exStart && k <= exEnd) { cls.push("pexp"); tags.push("생리 예정"); }
    if (!isP && info.ovu) {
      if (k === info.ovu) { cls.push("povu"); tags.push("배란 예상"); }
      else if (k >= fertA && k <= fertB) { cls.push("pfert"); tags.push("가임기"); }
    }
    if (k === tk) { cls.push("ptoday"); tags.push("오늘"); }
    var st = (rec && rec.st) || [];
    if (st.length) cls.push("pstkday");
    if (rec && rec.memo) { cls.push("phmemo"); tags.push("메모"); }
    var aria = (m + 1) + "월 " + d + "일 (" + pWd(k) + ")";
    if (tags.length) aria += " · " + tags.join(" · ");
    if (st.length) aria += " · " + pStickerNames(st);
    out.push('<button type="button" class="' + cls.join(" ") + '" data-day="' + k + '" aria-label="' + esc(aria) + '">' +
      '<span class="pn">' + d + '</span>' +
      (st.length ? '<span class="pstk" aria-hidden="true">' + pStickerEmoji(st.slice(0, 3)) + '</span>' : '') +
      '</button>');
  }
  return out.join("");
}

function pMemoRows() {
  var y = PVIEW.y, m = PVIEW.m, out = [];
  Object.keys(PSTATE.days).sort().forEach(function (k) {
    var r = PSTATE.days[k];
    if (!r) return;
    var dt = parseDay(k);
    if (dt.getFullYear() !== y || dt.getMonth() !== m) return;
    if (!(r.st && r.st.length) && !r.memo) return;
    var memo = (r.memo || "").replace(/\s+/g, " ").trim();
    out.push('<button type="button" class="pmrow" data-day="' + k + '">' +
      '<span class="pmd">' + pMd(k) + '</span>' +
      '<span class="pms" aria-hidden="true">' + (pStickerEmoji(r.st) || "✎") + '</span>' +
      '<span class="pmt">' + esc(memo || pStickerNames(r.st)) + '</span>' +
      '</button>');
  });
  return out.join("");
}

  if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
  var sheet = $("pSheet");
  if (!sheet) return;
  PSEL = k;
  pRenderSheet();
  sheet.hidden = false;
  document.body.style.overflow = "hidden";
  try { $("psClose").focus({ preventScroll: true }); } catch (e) {}
}
function pClose() {
  var sheet = $("pSheet");
  if (!sheet || sheet.hidden) return;
  sheet.hidden = true;
  document.body.style.overflow = "";
  PSEL = null;
}
function pOpenSettings(focusBulk) {
  var p = $("pSettings"), gear = $("pGear");
  if (!p || !gear) return;
  p.hidden = false;

    var b = $("pBulk");
    if (b) { try { b.focus(); } catch (e) {} }
  }
}

/* ── 기간 일괄 입력 파서 ─────────────────────── */
function pParseBulk(text, today) {
  var res = { ranges: [], bad: [] };
  var ty = today.getFullYear();
  function mk(y, mo, da) {
    if (!(y >= 2000 && y <= 2100)) return null;
    if (!(mo >= 1 && mo <= 12)) return null;
    if (!(da >= 1 && da <= 31)) return null;
    var dt = new Date(y, mo - 1, da);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== da) return null;
    return dayKey(dt);
  }
  function yearFor(mo, da) {
    var k = mk(ty, mo, da);
    if (!k) return null;
    if (parseDay(k) > today) { var k2 = mk(ty - 1, mo, da); if (k2) return k2; }
    return k;
  }
  function endIn(fromKey, mo, da) {
    var dt = parseDay(fromKey), y = dt.getFullYear();
    var b = new Date(y, mo - 1, da);
    if (b.getDate() !== da) return null;
    if (b < dt) { b = new Date(y + 1, mo - 1, da); if (b.getDate() !== da) return null; }
    return dayKey(b);
  }
  String(text || "").split(/[,;\n\r]+/).forEach(function (raw) {
    var s = String(raw).replace(/\s+/g, " ").trim();
    if (!s) return;
    s = s.replace(/\s*([~\-])\s*/g, "$1");
    var m, a = null, b = null;
    if ((m = s.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})[~\-](\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/))) {
      a = mk(+m[1], +m[2], +m[3]); b = mk(+m[4], +m[5], +m[6]);
    } else if ((m = s.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/))) {
      a = mk(+m[1], +m[2], +m[3]); b = a;
    } else if ((m = s.match(/^(\d{1,2})[.\-\/](\d{1,2})[~\-](\d{1,2})[.\-\/](\d{1,2})$/))) {
      a = yearFor(+m[1], +m[2]);
      if (a) b = endIn(a, +m[3], +m[4]);
    } else if ((m = s.match(/^(\d{1,2})[.\-\/](\d{1,2})[~\-](\d{1,2})$/))) {
      a = yearFor(+m[1], +m[2]);
      if (a) b = endIn(a, parseDay(a).getMonth() + 1, +m[3]);
      if (a && b && b < a) {
        var b2 = endIn(a, parseDay(a).getMonth() + 2, +m[3]);
        if (b2) b = b2;
      }
    } else if ((m = s.match(/^(\d{1,2})[.\-\/](\d{1,2})$/))) {
      a = yearFor(+m[1], +m[2]); b = a;
    } else {
      res.bad.push(String(raw).trim()); return;
    }
    if (!a || !b || b < a) { res.bad.push(String(raw).trim()); return; }
    var len = pDiff(a, b) + 1;
    if (len < 1 || len > 15) { res.bad.push(String(raw).trim()); return; }
    res.ranges.push({ start: a, end: b, len: len });
  });
  return res;
}

function pApplyRanges(ranges) {
  var days = 0;
  ranges.forEach(function (r) {
    var k = r.start;
    for (var i = 0; i < r.len; i++) {
      var rec = PSTATE.days[k] || (PSTATE.days[k] = {});
      rec.p = true;
      if (i === 0) rec.s = true;
      days++;
      k = pAdd(k, 1);
    }
  });
  return { days: days };
}

/* ── 내보내기 / 불러오기 ─────────────────────── */
function pExport() {
  var msg = $("pImpMsg");
  var payload = {
    app: "todayboard-period", v: 1, exported: new Date().toISOString(),
    cycle: PSTATE.cycle, periodLen: PSTATE.periodLen, auto: PSTATE.auto, days: PSTATE.days
  };
  var text = JSON.stringify(payload, null, 2);
  var fname = "period-backup-" + dayKey(new Date()).replace(/-/g, "") + ".json";
  try {
    var file = new File([text], fname, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "생리 캘린더 백업" }).then(function () {
        msg.className = "pmsg"; msg.textContent = "백업 파일을 내보냈어요.";
      }).catch(function () {});
      return;
    }
  } catch (e) {}
  try {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
    msg.className = "pmsg"; msg.textContent = "백업 파일을 내려받았어요.";
  } catch (e2) {
    msg.className = "pmsg err"; msg.textContent = "내보내지 못했어요. 브라우저에서 다시 시도해 주세요.";
  }
}

function pImportText(text) {
  var msg = $("pImpMsg");
  var o;
  try { o = JSON.parse(String(text)); } catch (e) { o = null; }
  var days = pCleanDays(o && o.days);
  if (!days || !Object.keys(days).length) {
    msg.className = "pmsg err";
    msg.textContent = "기록을 읽지 못했어요. 내보낸 JSON 파일인지 확인해 주세요.";
    return false;
  }
  var n = Object.keys(days).length;
  if (!window.confirm("불러온 기록 " + n + "일로 바꿀까요? 지금 이 기기에 있는 기록은 지워져요.")) return false;
  PSTATE.days = days;
  if (typeof o.cycle === "number" && o.cycle >= 18 && o.cycle <= 90) PSTATE.cycle = Math.round(o.cycle);
  if (typeof o.periodLen === "number" && o.periodLen >= 1 && o.periodLen <= 15) PSTATE.periodLen = Math.round(o.periodLen);
  if (o.auto === false) PSTATE.auto = false;
  periodSave();
  pRenderCal();
  msg.className = "pmsg";
  msg.textContent = n + "일 기록을 불러왔어요.";
  return true;
}

/* ── 연결 ─────────────────────────────────── */
function pBind() {
  var auto = $("pAuto");
  if (auto) auto.addEventListener("click", function () {
    PSTATE.auto = !PSTATE.auto;
    periodSave(); pRenderCal();
  });
  var cy = $("pCycle");
  if (cy) cy.addEventListener("change", function () {
    var v = parseInt(this.value, 10);
    if (!(v >= 18 && v <= 90)) v = PSTATE.cycle;
    PSTATE.cycle = v; PSTATE.auto = false;
    periodSave(); pRenderCal();
  });
  var ln = $("pLen");
  if (ln) ln.addEventListener("change", function () {
    var v = parseInt(this.value, 10);
    if (!(v >= 1 && v <= 15)) v = PSTATE.periodLen;
    PSTATE.periodLen = v; PSTATE.auto = false;
    periodSave(); pRenderCal();
  });
  var ba = $("pBulkApply");
  if (ba) ba.addEventListener("click", function () {
    var box = $("pBulk"), msg = $("pBulkMsg");
    var r = pParseBulk(box.value, new Date());
    if (!r.ranges.length) {
      msg.className = "pmsg err";
      msg.textContent = r.bad.length ? "형식을 알아보지 못했어요. 예) 3/2-6, 4/1-5" : "기간을 적어 주세요.";
      return;
    }
    var res = pApplyRanges(r.ranges);
    periodSave();
    box.value = r.bad.length ? r.bad.join(", ") : "";
    pRenderCal();
    var info = pInfo();
    msg.className = r.bad.length ? "pmsg err" : "pmsg";
    msg.textContent = r.ranges.length + "개 기간(" + res.days + "일) 기록했어요." +
      (info.autoOn ? " 평균 주기 " + info.cycle + "일로 다시 계산했어요." : "") +
      (r.bad.length ? " 못 읽은 항목: " + r.bad.join(", ") : "");
  });
  var ex = $("pExport");
  if (ex) ex.addEventListener("click", pExport);
  var ib = $("pImportBtn"), inf = $("pImport");
  if (ib && inf) {
    ib.addEventListener("click", function () { try { inf.click(); } catch (e) {} });
    inf.addEventListener("change", function () {
      var f = this.files && this.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { pImportText(fr.result); };
      fr.onerror = function () {
        var msg = $("pImpMsg");
        msg.className = "pmsg err";
        msg.textContent = "파일을 읽지 못했어요.";
      };
      fr.readAsText(f);
      this.value = "";
    });
  }

  var sheet = $("pSheet");
  if (sheet) {
    sheet.addEventListener("click", function (e) {
      if (e.target === sheet || (e.target.getAttribute && e.target.getAttribute("data-ps-close"))) pClose();
    });
    sheet.addEventListener("keydown", function (e) { if (e.key === "Escape") pClose(); });
  }
  var x = $("psClose");
  if (x) x.addEventListener("click", pClose);
  var done = $("psDone");
  if (done) done.addEventListener("click", pClose);

  var ps = $("psStart");
  if (ps) ps.addEventListener("click", function () {
    if (!PSEL) return;
    var r = PSTATE.days[PSEL] || (PSTATE.days[PSEL] = {});
    if (r.s) { r.s = false; }
    else { r.s = true; r.p = true; }
    pTidy(PSEL); periodSave(); pRenderSheet(); pRenderCal();
  });
  var pm = $("psMid");
  if (pm) pm.addEventListener("click", function () {
    if (!PSEL) return;
    var r = PSTATE.days[PSEL] || (PSTATE.days[PSEL] = {});
    if (r.p) { r.p = false; r.s = false; }
    else { r.p = true; }
    pTidy(PSEL); periodSave(); pRenderSheet(); pRenderCal();
  });
  var sticks = $("psSticks");
  if (sticks) sticks.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-st]") : null;
    if (!b || !PSEL) return;
    var id = b.getAttribute("data-st");
    var r = PSTATE.days[PSEL] || (PSTATE.days[PSEL] = {});
    var arr = r.st || (r.st = []);
    var at = arr.indexOf(id);
    if (at >= 0) arr.splice(at, 1);
    else arr.push(id);
    if (!arr.length) delete r.st;
    pTidy(PSEL); periodSave(); pRenderSheet(); pRenderCal();
  });
  var memo = $("psMemo");
  if (memo) memo.addEventListener("input", function () {
    if (!PSEL) return;
    var v = this.value.slice(0, 200);
    var r = PSTATE.days[PSEL];
    if (v.trim()) {
      if (!r) r = PSTATE.days[PSEL] = {};
      r.memo = v;
    } else if (r) {
      delete r.memo;
      pTidy(PSEL);
    }
    periodSave(); pRenderCal();
  });
  var del = $("psDel");
  if (del) del.addEventListener("click", function () {
    if (!PSEL || !pRec(PSEL)) { pClose(); return; }
    if (!window.confirm("이 날짜의 기록을 지울까요?")) return;
    delete PSTATE.days[PSEL];
    periodSave(); pRenderSheet(); pRenderCal();
  });
}

function periodInit() {
  PSTATE = periodLoad();
  var now = new Date();
  PVIEW = { y: now.getFullYear(), m: now.getMonth() };
  PSEL = null;
  var grid = $("pGrid");
  if (!grid) return;
  grid.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".pday") : null;
    if (b && b.getAttribute("data-day")) pOpen(b.getAttribute("data-day"));
  });
  $("pPrev").addEventListener("click", function () {
    PVIEW.m--; if (PVIEW.m < 0) { PVIEW.m = 11; PVIEW.y--; }
    pRenderCal();
  });
  $("pNext").addEventListener("click", function () {
    PVIEW.m++; if (PVIEW.m > 11) { PVIEW.m = 0; PVIEW.y++; }
    pRenderCal();
  });
  $("pMonth").addEventListener("click", function (e) {
    if (e.target && e.target.id === "pGoToday") {
      var n = new Date();
      PVIEW = { y: n.getFullYear(), m: n.getMonth() };
      pRenderCal();
    }
  });
  var sum = $("pSum");
  if (sum) sum.addEventListener("click", function (e) {
    if (e.target && e.target.id === "pQuick") pOpenSettings(true);
  });
  var memos = $("pMemos");
  if (memos) memos.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".pmrow") : null;
    if (b && b.getAttribute("data-day")) pOpen(b.getAttribute("data-day"));
  });
  var gear = $("pGear");
  if (gear) gear.addEventListener("click", function () {
    var p = $("pSettings");
    var open = p.hidden;
    p.hidden = !open;
    gear.setAttribute("aria-expanded", open ? "true" : "false");
  });
  pBind();
  pRenderCal();
}

  if (!state.bills[due] || typeof state.bills[due] !== "object") state.bills[due] = {};

}
function renderBills() {

  items.forEach(function (c) {
    var row = document.querySelector('.bill[data-bill="' + c.id + '"]');

    var on = !!box[c.id];
    if (on) paid++;
    row.classList.toggle("paid", on);
    row.setAttribute("aria-pressed", on ? "true" : "false");
    var sw = row.querySelector(".sw");
    if (sw) {
      sw.classList.toggle("on", on);
      sw.setAttribute("aria-checked", on ? "true" : "false");
    }
  });
  var tag = $("billTag");
  if (tag) {
    var all = items.length > 0 && paid === items.length;
    tag.textContent = all ? "출금 완료" : ((DATA.bills.tag || "출금 예정") + (paid ? " · " + paid + "/" + items.length : ""));
    tag.className = "tag" + (all ? " done" : " hot");
  }
  var foot = $("billFoot");
  if (foot) {
    foot.textContent = items.length && paid === items.length
      ? items.length + "건 모두 출금 완료로 표시했어요. 이 브라우저에 저장돼요."
      : (paid
          ? paid + "건 출금 완료 · " + (items.length - paid) + "건 남음. 체크는 이 브라우저에 저장돼요."
          : (DATA.bills.note || ""));
  }
}

/* ── 할 일 · 구매 목록 ─────────────────────── */
var undoData = null, undoTimer = null;
function hideUndo() {
  clearTimeout(undoTimer);
  var box = $("undo");
  if (box) box.classList.remove("show");
  undoData = null;
}
function removeItem(id) {
  var idx = -1;
  for (var i = 0; i < state.items.length; i++) { if (state.items[i].id === id) { idx = i; break; } }
  if (idx < 0) return;
  undoData = { item: state.items[idx], index: idx };
  state.items.splice(idx, 1);
  save(); renderItems();
  $("undoTxt").textContent = "\u201C" + undoData.item.text + "\u201D 삭제했어요";
  $("undo").classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, 8000);
}
function renderItems() {
  var ul = $("items");
  ul.innerHTML = "";
  state.items.forEach(function (it) {
    var li = document.createElement("li");
    li.className = "item" + (it.done ? " done" : "");

    var sw = document.createElement("button");
    sw.type = "button";
    sw.className = "sw sm" + (it.done ? " on" : "");
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", it.done ? "true" : "false");
    sw.setAttribute("aria-label", it.text + " 완료 표시");
    sw.addEventListener("click", function (e) {
      e.stopPropagation();
      it.done = !it.done; save(); renderItems();
    });

    var cat = document.createElement("span");
    cat.className = "cat " + (it.cat === "buy" ? "buy" : "todo");
    cat.textContent = it.cat === "buy" ? "구매" : "할 일";

    var txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = it.text;
    txt.addEventListener("click", function () {
      it.done = !it.done; save(); renderItems();
    });

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.innerHTML = "&times;";
    del.title = "삭제";
    del.setAttribute("aria-label", it.text + " 삭제");
    del.addEventListener("click", function (e) {
      e.stopPropagation();
      removeItem(it.id);
    });

    li.appendChild(sw);
    li.appendChild(cat);
    li.appendChild(txt);
    li.appendChild(del);
    ul.appendChild(li);
  });

  if (!state.items.length) {
    var empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "아직 적은 게 없어요. 위에 적고 Enter를 누르면 추가돼요.";
    ul.appendChild(empty);
  }

  var doneCount = state.items.filter(function (i) { return i.done; }).length;
  var tag = $("listTag");
  tag.textContent = doneCount + "/" + state.items.length + " 완료";
  tag.className = "tag" + (state.items.length && doneCount === state.items.length ? " done" : "");
  paintChip("chipTodo", todoChip());
}

function bindName(input, obj) {
  input.value = obj.name;
  input.addEventListener("input", function () {
    obj.name = input.value.slice(0, 30) || "";
    save();
  });
  input.addEventListener("blur", function () {
    if (!input.value.trim()) { obj.name = "이름 없음"; input.value = obj.name; save(); }
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
  });
}

function bindPage(d) {
  var dailySw = $("dailySw"), weeklySw = $("weeklySw");
  dailySw.addEventListener("click", function () {
    var dk = dayKey(new Date());
    state.meds.daily.doneDate = state.meds.daily.doneDate === dk ? null : dk;
    save(); renderMeds();
  });
  weeklySw.addEventListener("click", function () {
    var now = new Date(), wk = weekKey(now), w = state.meds.weekly;
    if (w.doneWeek === wk) {
      w.doneWeek = null;
      w.last = w.prev || null;
      w.prev = null;
    } else {
      w.prev = w.last || null;
      w.last = dayKey(now);
      w.doneWeek = wk;
    }
    save(); renderMeds();
  });

  var pv = $("photoView");
  Array.prototype.forEach.call(document.querySelectorAll(".pthumb[data-src]"), function (b) {
    b.addEventListener("click", function () {
      openPhotoView(b.getAttribute("data-src"), b.getAttribute("data-cap"));
    });
  });
  if (pv) {
    pv.addEventListener("click", function (e) {
      if (e.target === pv || e.target.getAttribute("data-pv-close")) closePhotoView();
    });
    $("pvClose").addEventListener("click", closePhotoView);
  }

  bindName($("dailyName"), state.meds.daily);
  bindName($("weeklyName"), state.meds.weekly);
  Array.prototype.forEach.call(document.querySelectorAll(".pencil"), function (b) {
    b.addEventListener("click", function () {
      var inp = $(b.getAttribute("data-for"));
      if (inp) { inp.focus(); inp.select(); }
    });
  });

  $("undoBtn").addEventListener("click", function () {
    if (!undoData) return;
    var at = Math.min(undoData.index, state.items.length);
    state.items.splice(at, 0, undoData.item);
    $("undo").classList.remove("show");
    clearTimeout(undoTimer);
    undoData = null;
    save(); renderItems();
  });

  $("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = $("newItem");
    var text = inp.value.replace(/\s+/g, " ").trim();
    if (!text) { inp.focus(); return; }
    state.items.push({
      id: "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      cat: $("newCat").value === "buy" ? "buy" : "todo",
      text: text.slice(0, 60),
      done: false
    });
    inp.value = "";
    save(); renderItems();
    inp.focus();
    var last = $("items").lastElementChild;
    if (last && last.scrollIntoView) last.scrollIntoView({ block: "nearest" });
  });

  Array.prototype.forEach.call(document.querySelectorAll(".bill"), function (row) {
    var toggle = function (e) {
      if (e) e.preventDefault();
      var id = row.getAttribute("data-bill");
      if (!id) return;
      var box = billsStore();
      if (box[id]) delete box[id]; else box[id] = true;
      save(); renderBills();
    };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") toggle(e);
    });
  });

  $("lockBtn").addEventListener("click", lockNow);

  renderMeds();
  renderBills();
  renderItems();
  periodInit();
}

/* ── 날짜가 바뀌면 자동으로 오늘/이번 주 상태로 ── */
var stamp = null;
function watchDay() {
  stamp = dayKey(new Date()) + "|" + weekKey(new Date());
  setInterval(function () {
    var s = dayKey(new Date()) + "|" + weekKey(new Date());
    if (s !== stamp) { stamp = s; if (DATA && !$("page").hidden) renderMeds(); }
  }, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && DATA && !$("page").hidden) { renderMeds(); refreshPatch(); }
  });
}

/* ── 열기 / 잠그기 ─────────────────────────── */
function showPage(data) {
  DATA = data;
  var page = $("page");
  page.innerHTML = pageHTML(data);
  page.hidden = false;
  $("lock").hidden = true;
  document.body.style.overflow = "";
  bindPage(data);
}
function lockNow() {
  try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
  var page = $("page");
  page.hidden = true;
  page.innerHTML = "";
  DATA = null;
  $("lock").hidden = false;
  document.body.style.overflow = "hidden";
  clearPw();
  if (pwEl) { try { pwEl.focus(); } catch (e) {} }
  window.scrollTo(0, 0);
}

/* ── 비밀번호 입력 ─────────────────────────── */
var busy = false, pwEl = null, openBtn = null;

function setErr(msg) { var e = $("perr"); if (e) e.textContent = msg || ""; }
function clearPw() { if (pwEl) pwEl.value = ""; setErr(""); }
function shakeLock() {
  var lock = $("lock");
  lock.classList.remove("shake");
  void lock.offsetWidth;
  lock.classList.add("shake");
}
function toggleReveal() {
  if (!pwEl) return;
  var show = pwEl.type === "password";
  pwEl.type = show ? "text" : "password";
  var eye = $("eye");
  if (eye) {
    eye.setAttribute("aria-pressed", show ? "true" : "false");
    eye.setAttribute("aria-label", show ? "비밀번호 가리기" : "비밀번호 보기");
  }
  try { pwEl.focus(); var n = pwEl.value.length; pwEl.setSelectionRange(n, n); } catch (e) {}
}
function submitPw() {
  if (busy || !pwEl) return;
  var value = pwEl.value;
  if (!value) { setErr("비밀번호를 입력해 주세요."); try { pwEl.focus(); } catch (e) {} return; }
  busy = true;
  pwEl.disabled = true;
  if (openBtn) openBtn.disabled = true;
  setErr("확인 중…");
  deriveKey(value).then(function (key) {
    return decryptWith(key).then(function (data) { return { key: key, data: data }; });
  }).then(function (res) {
    return crypto.subtle.exportKey("raw", res.key).then(function (raw) {
      try { localStorage.setItem(LOCK_KEY, b64e(raw)); } catch (e) {}
      busy = false;
      pwEl.disabled = false;
      pwEl.value = "";
      if (openBtn) openBtn.disabled = false;
      setErr("");
      BASE = res.data;
      loadPatch(res.data).then(showPage);
    });
  }).catch(function () {
    busy = false;
    pwEl.disabled = false;
    pwEl.value = "";
    if (openBtn) openBtn.disabled = false;
    setErr("비밀번호가 맞지 않아요. 다시 입력해 주세요.");
    shakeLock();
    try { pwEl.focus(); } catch (e) {}
  });
}

function withStoredKey() {
  var saved = null;
  try { saved = localStorage.getItem(LOCK_KEY); } catch (e) {}
  if (!saved) return Promise.reject(new Error("no key"));
  return importKey(saved).then(decryptWith).then(function (data) {
    BASE = data;
    return loadPatch(data).then(showPage);
  });
}

/* ── 시작 ─────────────────────────────────── */
(function boot() {
  pwEl = $("pw");
  openBtn = $("openBtn");
  var form = $("pwform");
  if (form) form.addEventListener("submit", function (e) { e.preventDefault(); submitPw(); });
  if ($("eye")) $("eye").addEventListener("click", toggleReveal);
  watchDay();
  if (!window.crypto || !crypto.subtle) {
    $("lock").hidden = false;
    $("curl").textContent = "이 화면은 https 주소에서 열어야 잠금이 풀려요.";
    return;
  }
  withStoredKey().catch(function () {
    $("lock").hidden = false;
    document.body.style.overflow = "hidden";
    if (pwEl) { try { pwEl.focus(); } catch (e) {} }
  });
})();
</script>
